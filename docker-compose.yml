services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kreyora
      POSTGRES_USER: kreyora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kreyora_dev}
    ports:
      - "5432:5432"
    volumes:
      - kreyora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kreyora -d kreyora"]
      interval: 5s
      timeout: 5s
      retries: 5

  # AUTOMATED MIGRATION RUNNER
  # This uses your existing API image, runs the EF migrations & seeds, then stops safely.
  migrator:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    entrypoint: ["dotnet", "Kreyora.WebApi.dll"] # Forces execution of the main assembly
    command: ["--migrate", "--seed"] # Triggers BOTH blocks in your Program.cs
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: "Host=postgres;Port=5432;Database=kreyora;Username=kreyora;Password=${POSTGRES_PASSWORD:-kreyora_dev}"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: "Host=postgres;Port=5432;Database=kreyora;Username=kreyora;Password=${POSTGRES_PASSWORD:-kreyora_dev}"
      App__Name: "Kreyora API"
      App__Version: "0.1.0"
      Cors__AllowedOrigins__0: http://localhost:3000
      Email__Smtp__ApplicationName: Kreyora
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: 1025
      Email__Smtp__Security: None
      Email__Smtp__SenderEmail: no-reply@kreyora.test
      Email__Smtp__SenderDisplayName: Kreyora Development
      Email__Smtp__ApplicationPublicUrl: http://localhost:3000
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Resource guidance (uncomment for constrained environments):
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5001
    ports:
      - "3000:3000"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - "127.0.0.1:8025:8025"

  # Reverse-proxy placeholder (uncomment when needed):
  # proxy:
  #   image: caddy:2-alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #   depends_on:
  #     - api
  #     - web

volumes:
  kreyora_pgdata:
