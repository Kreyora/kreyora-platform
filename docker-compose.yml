services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kreyora
      POSTGRES_USER: kreyora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kreyora_dev}
    ports:
      - "5432:5432"
    volumes:
      - kreyora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kreyora -d kreyora"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: "Host=postgres;Port=5432;Database=kreyora;Username=kreyora;Password=${POSTGRES_PASSWORD:-kreyora_dev}"
      App__Name: "Kreyora API"
      App__Version: "0.1.0"
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Resource guidance (uncomment for constrained environments):
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Reverse-proxy placeholder (uncomment when needed):
  # proxy:
  #   image: caddy:2-alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #   depends_on:
  #     - api
  #     - web

volumes:
  kreyora_pgdata:
