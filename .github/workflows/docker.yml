name: Manual Docker validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build-backend-image:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build backend Docker image
        run: docker build --file services/api/Dockerfile services/api

  build-frontend-image:
    name: Build frontend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build frontend Docker image
        run: docker build --file apps/web/Dockerfile .
